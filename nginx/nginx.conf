# nginx.conf
# ไฟล์ config ของ Nginx ทำหน้าที่เป็น reverse proxy
# รับ request จากผู้ใช้ภายนอกที่ port 80 แล้วส่งต่อ (proxy) ไปยัง Flask app container

server {
    # nginx จะ listen ที่ port 80 ภายใน container ของตัวเอง
    listen 80;

    # ชื่อ server (ใช้ค่า default เพราะเป็น local project)
    server_name localhost;

    location / {
        # proxy_pass ชี้ไปที่ service ชื่อ "app" ตามที่ประกาศไว้ใน docker-compose.yml
        # Docker internal DNS จะ resolve ชื่อ "app" เป็น IP ของ container นั้นให้อัตโนมัติ
        proxy_pass http://app:5000;

        # ส่งต่อ header ต่าง ๆ ของ request เดิมไปยัง backend
        # เพื่อให้ Flask app รู้ข้อมูล host/ip ที่แท้จริงของผู้ใช้
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
